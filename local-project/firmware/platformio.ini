; PlatformIO Project Configuration File
; Project: Agrinex Weather Station — ESP32 Real-time Node with INA226 Battery Monitor
; Schematic: EasyEDA ESP-WROOM-32 (I2C: D21/D22, DHT22: D32, Anemo: D27, SD: D5/D18/D19/D23)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = direct, esp32_exception_decoder
board_build.flash_mode = dio
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit Unified Sensor@^1.1.15
	claws/BH1750@^1.3.0
	bblanchon/ArduinoJson@^7.4.1
	adafruit/RTClib@^2.1.4
	robtillaart/INA226@^0.6.6
	SPI
	SD

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_deps = 
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit Unified Sensor@^1.1.15
	claws/BH1750@^1.3.0
	bblanchon/ArduinoJson@^7.4.1
	adafruit/RTClib@^2.1.4
	robtillaart/INA226@^0.6.6
	SPI
	SD
